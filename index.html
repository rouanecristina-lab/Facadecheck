<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FaçadeCheck</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0B1220;--bg2:#0F1B2D;--card:rgba(20,32,52,.62);--bd:rgba(120,190,255,.16);--tx:#E6EEF9;--mu:#92A4BF;--ac:#22D3EE;--ac2:#818CF8;--ok:#34D399;--no:#FB7185;--gap:#FBBF24;--na:#7C8DA8;--grid:rgba(120,190,255,.06)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF3FA;--bg2:#E3EBF6;--card:rgba(255,255,255,.8);--bd:rgba(30,70,120,.18);--tx:#10213A;--mu:#4A5E7C;--ac:#0369A1;--ac2:#4F46E5;--ok:#047857;--no:#BE123C;--gap:#B45309;--na:#5B6B84;--grid:rgba(30,70,120,.07)}}
:root[data-theme="light"]{--bg:#EEF3FA;--bg2:#E3EBF6;--card:rgba(255,255,255,.8);--bd:rgba(30,70,120,.18);--tx:#10213A;--mu:#4A5E7C;--ac:#0369A1;--ac2:#4F46E5;--ok:#047857;--no:#BE123C;--gap:#B45309;--na:#5B6B84;--grid:rgba(30,70,120,.07)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;min-height:100%;color:var(--tx);font:15px/1.45 "Space Grotesk",system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(34,211,238,.12),transparent),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(var(--bg),var(--bg2));background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
code,.mono,input[type=number]{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;letter-spacing:.02em}header .sp{flex:1}
.btn{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;transition:.2s}.btn:hover{border-color:var(--ac);box-shadow:0 0 12px -4px var(--ac)}.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04121f;border:0;font-weight:600}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 8px 28px -14px #000;transition:.2s}.card:hover{border-color:var(--ac)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu)}
main{padding:16px;max-width:1400px;margin:0 auto}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.shell{display:grid;gap:14px;grid-template-columns:190px 1fr 310px}.side{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:6px}.hud{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:12px}
.cat{display:flex;gap:8px;align-items:center;text-align:left;padding:7px 9px;border:1px solid transparent;border-radius:10px;background:transparent}.cat.on{border-color:var(--ac);background:var(--card)}.cat small{display:block;color:var(--mu);font-size:11px}
.it{margin-bottom:12px}.it:focus{border-color:var(--ac)}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top .sp{flex:1}
.k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:99px;border:1px solid}.kC{color:var(--no)}.kM{color:var(--gap)}.km{color:var(--mu)}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor}.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;box-shadow:0 0 8px currentColor}
.sC{color:var(--ok)}.sP{color:var(--gap)}.sN{color:var(--no)}.sS{color:var(--gap)}.sA{color:var(--na)}.s_{color:var(--mu)}
.seg{display:flex;gap:2px;background:rgba(127,150,190,.12);border-radius:10px;padding:3px;margin:8px 0}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:13px;transition:.2s}
.seg button[aria-checked=true]{background:var(--ac);color:#04121f;box-shadow:0 0 12px -2px var(--ac);font-weight:600}.seg button[data-r=N][aria-checked=true]{background:var(--no)}.seg button[data-r=S][aria-checked=true]{background:var(--gap)}.seg button[data-r=A][aria-checked=true]{background:var(--na)}.seg button[data-r=C][aria-checked=true]{background:var(--ok)}.seg button[data-r=P][aria-checked=true]{background:var(--gap)}.seg button{padding:6px 2px;font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{background:rgba(127,150,190,.1);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.lim{font-size:12px;color:var(--ac)}.hint{font-size:12px;color:var(--gap);margin:4px 0}
.meter{position:relative;height:8px;border-radius:6px;background:color-mix(in srgb,var(--no) 35%,transparent);margin:8px 0}.meter b{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.7;border-radius:6px}.meter i{position:absolute;top:-4px;width:3px;height:16px;background:var(--tx);border-radius:2px;transition:left .25s}
.bar{height:6px;border-radius:6px;background:rgba(127,150,190,.2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:rgba(127,150,190,.2)}.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .8s}
.big{font-size:34px;font-weight:300;font-family:"JetBrains Mono",monospace}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu)}tr[data-go]{cursor:pointer}tr[data-go]:hover{background:rgba(34,211,238,.08)}
.layer{cursor:pointer;transition:.2s}.layer:hover{filter:brightness(1.4)}.crit{animation:pu 1.6s infinite}@keyframes pu{50%{opacity:.5}}
.cota{font:10px "JetBrains Mono",monospace;fill:var(--ac)}.layer:hover rect{stroke-width:3}.layer.on rect{filter:drop-shadow(0 0 5px var(--ac))}.lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lg button{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px}.lg button[aria-pressed=true]{border-color:var(--ac);background:rgba(34,211,238,.15)}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}.cota.bad{fill:var(--no)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:8px 16px;border-radius:10px;z-index:40}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--ac);border-radius:14px;max-width:640px;width:92%}dialog::backdrop{background:#0008}dialog{max-height:88vh;overflow:auto}dialog h4{margin:14px 0 4px;color:var(--ac)}dialog li,dialog p{font-size:14px}.ib{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--ac);background:transparent;color:var(--ac);font:italic 700 13px Georgia,serif;line-height:1;padding:0;display:inline-grid;place-items:center}.ib:hover,.ib[aria-expanded=true]{background:var(--ac);color:#04121f}#pop{position:fixed;z-index:50;width:min(300px,calc(100vw - 16px));background:var(--bg2);border:1px solid var(--ac);border-radius:12px;padding:10px 12px;box-shadow:0 12px 32px -8px #000;font-size:13px}#pop[hidden]{display:none}#pop p{margin:6px 0 0}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}.cv{position:relative;height:300px}.sel{padding:3px 9px;border-radius:99px;font-weight:600;border:1px solid}
@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:25}.hud{position:static;order:-1}.two{grid-template-columns:1fr}main{padding-bottom:90px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pr{display:none}
@media print{:root{--bg:#fff;--bg2:#fff;--card:#fff;--bd:#bbb;--tx:#111;--mu:#444;--ac:#075985;--ok:#047857;--no:#BE123C;--gap:#B45309;--na:#555}body{background:#fff}header,.noprint,.side,.toast,body::before{display:none!important}.card{box-shadow:none;backdrop-filter:none;break-inside:avoid}.pr{display:block}.pg{break-after:page}.two{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>Façade<span style="color:var(--ac)">Check</span></h1><span id="hn" class="mono lbl"></span><span class="sp"></span><span id="sv" class="lbl"></span>
<button class="btn" data-act="home">Projetos</button><button class="btn" data-act="guia">Sobre o questionário</button><button class="btn" data-act="cfg">Configurações</button><button class="btn" data-act="io">Exportar / Importar</button><button class="btn" data-act="theme" aria-label="Alternar tema">Tema</button></header>
<main id="app"></main><dialog id="dlg"></dialog>
<script>
/* ============ DADOS ============ */
const PARAMETROS_NORMATIVOS={esp:{int:[5,20],ext:[20,30],teto:[0,20],alerta:15,emb:[15,25],reb:[2,5],cu:[20,30]},ra:{ext:.30,int:.20,ceram:.30,teto:.20},chapDias:3,embAcab:21,embAcabInd:14,curaH:12,friso:{larg:[15,20],rem:10},epu:.6,duplaCm2:400,jtH:3,jtV:6,tela:[15,20],verga:[20,30],peit:2};
const P=PARAMETROS_NORMATIVOS;
const CATS=[{id:'A',n:'Espessura'},{id:'B',n:'Aderência'},{id:'C',n:'Substrato / chapisco'},{id:'D',n:'Argamassa e execução'},{id:'E',n:'Juntas e frisos'},{id:'F',n:'Revest. cerâmico'},{id:'G',n:'Telas de reforço'},{id:'H',n:'Vãos e águas'},{id:'I',n:'Desempenho SVVE'},{id:'J',n:'Boas práticas / durabilidade'}];
const DYN={jh:p=>Math.max(1,Math.ceil(p.alt/P.jtH)-1),jv:p=>Math.max(0,Math.ceil((p.comp||0)/P.jtV)-1)};
const W={cer:p=>p.acab=='cer',fr:p=>p.acab=='pint',eb:p=>p.sist=='eb',cu:p=>p.sist=='cu',gt30:p=>num(p.ans.A1&&p.ans.A1.v)>DYN.espMax(p)};
const I=(id,d,n,k,l,x={})=>Object.assign({id,c:id[0],d,n,k,l,t:'q'},x);
const R=(id,d,n,k,l,u,mn,mx,x={})=>I(id,d,n,k,l,Object.assign({t:'r',u,mn,mx},x));
/* CHECKLIST_DATA: k = C crítico, M maior, m menor; l = camada do corte */
const CHECKLIST_DATA=[
R('A1','Espessura total especificada – parede externa','NBR 13749:2013','C','emb','mm',...P.esp.ext),
R('A2','Espessura – teto interno/externo (se aplicável)','NBR 13749:2013','m','emb','mm',null,P.esp.teto[1]),
R('A3','Espessura – parede interna (se aplicável)','NBR 13749:2013','m','emb','mm',...P.esp.int),
R('A4','Espessura do emboço','Carasek 2010','M','emb','mm',...P.esp.emb,{w:'eb'}),
R('A5','Espessura do reboco','Carasek 2010','m','reb','mm',...P.esp.reb,{w:'eb'}),
I('A6','Soma emboço + reboco dentro de 20–30 mm','NBR 13749:2013','M','emb',{w:'eb',t:'sum'}),
R('A7','Camada única cobre 20–30 mm','NBR 13749:2013','M','reb','mm',...P.esp.cu,{w:'cu'}),
I('A8','Espessura especificada em projeto','NBR 13749:2013','M','emb'),
I('A9','Aplicação em camadas sucessivas (e > 30 mm)','NBR 13749:2013','C','emb',{w:'gt30'}),
I('A10','Tela de reforço intermediária (e > 30 mm)','NBR 13749 / Bauer 2005','C','tela',{w:'gt30'}),
R('B1','Ra prevista/ensaiada – média (parede externa)','NBR 13749:2013','C','emb','MPa',P.ra.ext,null),
I('B2','Projeto prevê ensaio de arrancamento','NBR 13528','M','emb'),
I('B3','Traço evita excesso de cimento (módulo alto, fissuração frágil)','Thomaz e Helene 2000','M','emb'),
I('C1','Substrato caracterizado (sucção, rugosidade, limpeza, estabilidade)','Bauer 2005','M','base'),
I('C2','Gradiente de rigidez E_subs > E_chapisco > E_emboço > E_reboco','Carasek 2010','M','chap'),
I('C3','Tipo de chapisco especificado','NBR 7200:1998','M','chap'),
I('C4','Chapisco coerente com a sucção do substrato','Carasek 2010','M','chap'),
I('C5','Riscos do chapisco rolado considerados (planeza, selagem de poros)','Carasek 2010','m','chap'),
R('C6','Cura úmida do chapisco (horas)','NBR 7200:1998','M','chap','h',P.curaH,null),
I('D1','Tipo/traço da argamassa, propriedades frescas e retração','NBR 13749:2013','M','emb'),
R('D2','Prazo chapisco → emboço','NBR 7200:1998','M','emb','dias',P.chapDias,null),
R('D3','Prazo emboço → acabamento (21 d obra; 14 d industrializada c/ controle)','NBR 7200:1998','M','reb','dias',P.embAcab,null),
I('D4','Controle tecnológico de canteiro previsto','NBR 7200:1998','m','emb'),
I('E1','Friso horizontal a cada pavimento, alinhado às vigas','ABCP 2002 / NBR 13755','M','friso',{w:'fr'}),
R('E2','Largura do friso','ABCP 2002','M','friso','mm',...P.friso.larg,{w:'fr'}),
R('E3','Espessura remanescente no fundo do friso (profundidade = e/2)','ABCP 2002','M','friso','mm',P.friso.rem,null,{w:'fr',h:'fr'}),
I('E4','Friso executado após desempeno; marcação com nível/régua','ABCP 2002','m','friso',{w:'fr'}),
I('E5','Juntas estruturais acompanhadas e seladas com mástique elastomérico','NBR 13529:2013','C','base'),
R('E6','Juntas horizontais de movimentação previstas (nº)','NBR 13755:2017','M','cer','un',null,null,{w:'cer',dyn:'jh'}),
R('E7','Juntas verticais previstas (nº, espaçamento ≤ 6 m)','NBR 13755:2017','M','cer','un',null,null,{w:'cer',dyn:'jv'}),
I('E8','Seccionamento total, tarugo, selante PU/MS e rejunte deformável','NBR 13755:2017','M','cer',{w:'cer'}),
I('E9','Dessolidarização em quinas, platibandas e esquadrias','NBR 13755:2017','M','cer',{w:'cer'}),
I('F1','Placas BIa/BIb','NBR 13755:2017','M','cer',{w:'cer'}),
R('F2','EPU das placas','NBR 13755:2017','M','cer','mm/m',null,P.epu,{w:'cer'}),
I('F3','Argamassa colante AC-III ou AC-III-E','NBR 13755:2017','M','col',{w:'cer'}),
I('F4','Dupla colagem (área da placa em cm² no campo; exigida se > 400 cm² ou acima do térreo; tardoz > 95%)','NBR 13755:2017','M','col',{w:'cer',t:'dc',u:'cm²'}),
I('F5','Projeto executivo com modulação e juntas de assentamento','NBR 13755:2017','m','cer',{w:'cer'}),
I('G1','Tela na interface concreto/alvenaria (vigas e pilares)','Medeiros e Sabbatini 1999','M','tela'),
R('G2','Transpasse da tela para cada lado','Medeiros e Sabbatini 1999','M','tela','cm',...P.tela),
I('G3','Tela no emboço (terço médio/externo), nunca sobre base crua','Bauer 2005','M','tela'),
I('G4','Fixação mecânica por pinos galvanizados, sem ondulações','Medeiros e Sabbatini 1999','m','tela'),
R('H1','Vergas/contravergas além das faces do vão','Thomaz e Helene 2000','M','vao','cm',...P.verga),
R('H2','Caimento do peitoril para o exterior','NBR 15575-4:2025','C','vao','%',P.peit,null),
I('H3','Pingadeira/lacrimal na face inferior do ressalto','NBR 15575-4:2025','M','vao'),
I('H4','Detalhes de arremates de esquadrias e interfaces','NBR 15575-4:2025','m','vao'),
I('I1','Segurança estrutural e resistência mecânica (vento, impacto)','NBR 15575-4:2025','C','emb'),
I('I2','Estanqueidade à água de chuva','NBR 15575-4:2025','C','emb'),
I('I3','Resistência a choques térmicos','NBR 15575-4:2025','M','emb'),
I('I4','Conforto térmico-acústico','NBR 15575-4:2025','m','emb'),
I('J1','Platibandas e muretas com rufo/pingadeira e proteção de topo (evita infiltração)','Boa prática – Thomaz e Helene 2000','M','vao'),
I('J2','Pingadeiras ou frisos em soleiras e elementos salientes (marquises, balanços)','Boa prática – ABCP 2002','M','vao'),
I('J3','Reforço (tela ou cantoneira) em quinas e encontros com esquadrias','Boa prática – Medeiros e Sabbatini 1999','M','tela'),
I('J4','Estudo de movimentações térmicas e higroscópicas da base e do revestimento','Boa prática – Bauer 2005','M','base'),
I('J5','Detalhamento gráfico em escala (juntas, frisos, telas, pingadeiras, arremates)','Boa prática – ABCP 2002','M','emb'),
I('J6','Tinta/textura compatível: permeável ao vapor e resistente à alcalinidade da base','Boa prática – Carasek 2010','M','reb',{w:'fr'}),
I('J7','Painel-protótipo (mock-up) previsto e aprovado antes da execução','Boa prática – Bauer 2005','m','emb'),
I('J8','Plano de inspeção e manutenção preventiva (selantes, juntas, pintura) com periodicidade','Boa prática – manutenção preventiva','M','emb'),
I('J9','Hidrofugante ou proteção superficial avaliada em exposição severa à chuva dirigida','Boa prática – Thomaz e Helene 2000','m','reb'),
I('J10','Ancoragens de andaimes/balancins previstas, com furos posteriormente selados','Boa prática – execução','m','emb'),
I('J11','Inspeção por percussão do tardoz cerâmico prevista no controle de execução','Boa prática – Medeiros e Sabbatini 1999','m','cer',{w:'cer'})];
const LAYERS=[['base','Base','#5b6b84',10,60],['chap','Chapisco','#7c8da8',70,6],['emb','Emboço',null,76,55],['reb','Reboco / única',null,131,10],['col','Arg. colante',null,141,8],['cer','Placa cerâmica',null,149,14]];
/* ===== REVISÃO conforme o TCC: novos itens, correções, origens ===== */
DYN.verga=p=>Math.max(20,Math.ceil((p.vao||0)*20));
DYN.raInt=p=>p.acab=='cer'?P.ra.ceram:P.ra.int;
DYN.embAc=p=>p.arg=='ind'?P.embAcabInd:P.embAcab;
W.trans=p=>p.subs!='pc';

CHECKLIST_DATA.push(
R('B4','Ra – parede interna (≥ 0,20 MPa pintura/base p/ reboco; ≥ 0,30 MPa cerâmica ou laminado), se aplicável','NBR 13749:2013','M','emb','MPa',null,null,{dyn:'raInt'}),
R('B5','Ra – teto (se aplicável)','NBR 13749:2013','m','emb','MPa',P.ra.teto,null),
I('C7','Rugosidade superficial da base caracterizada/especificada','Bauer 2005; Barros e Sabbatini 2001','M','base'),
I('C8','Limpeza e sanidade da base (poeira, desmoldantes, eflorescências) com tratamento previsto','Bauer 2005; Barros e Sabbatini 2001','M','base'),
R('F6','Preenchimento do tardoz da placa (dupla colagem)','NBR 13755:2017','M','col','%',95,100,{w:'cer'}),
I('H5','Vergas sobre todos os vãos e contravergas sob janelas, com altura ≥ 10 cm','NBR 8545:1984','M','vao'),
I('H6','Vãos > 2,40 m: verga/contraverga calculada como viga (N/A se não houver)','NBR 8545:1984','M','vao'),
I('H7','Vãos próximos e na mesma altura: verga contínua','NBR 8545:1984; Thomaz et al. 2009','m','vao'),
I('H8','Impermeabilização do requadro/base da contraverga sob o peitoril','Thomaz et al. 2009; Baía e Sabbatini 2000','M','vao'),
R('H9','Projeção do peitoril além do plano da fachada acabada','Baía e Sabbatini 2000; Thomaz e Helene 2000','M','vao','cm',2,5),
R('H10','Lacrimal do peitoril: largura','Baía e Sabbatini 2000','M','vao','mm',10,null),
R('H11','Lacrimal do peitoril: profundidade','Baía e Sabbatini 2000','M','vao','mm',5,null),
R('H12','Lacrimal: afastamento da aresta externa','Baía e Sabbatini 2000','M','vao','cm',1.5,null),
R('H13','Embutimento lateral do peitoril (ou abas de contenção)','Baía e Sabbatini 2000','M','vao','cm',2,null),
I('H14','Junta caixilho-peitoril com selante elastomérico estanque (resistente a UV)','NBR 10821-2:2023','M','vao'),
I('I5','Segurança contra incêndio / compartimentação do SVVE','NBR 15575-4:2025','M','emb'),
I('K1','Projetos de arquitetura, estrutura, alvenaria, esquadrias e fachada compatibilizados','Antunes 2011; Bauer 2005','M','emb'),
I('K2','Vãos, vergas e peitoris coerentes entre as pranchas de arquitetura e estrutura','Thomaz et al. 2009','M','vao'));
const F=id=>CHECKLIST_DATA.find(i=>i.id==id);

const guiaHTML=()=>`<h3>Sobre o questionário</h3><p><b>O que é:</b> um checklist de <u>auditoria documental</u> de projeto de fachada. Ele avalia o que está <b>especificado no projeto</b> (pranchas, detalhes e memorial descritivo), não a obra executada. Os critérios vêm das normas ABNT, da literatura técnica e de boas práticas, e a nota final é o ICP (Índice de Conformidade Projetual).</p>
<h4>Como usar</h4><ol><li>Cadastre a obra (acabamento, substrato, sistema de camadas, altura, pavimentos). O cadastro ativa ou oculta blocos e itens automaticamente.</li><li>Com o projeto em mãos, percorra os blocos A a J e responda cada item.</li><li>Acompanhe o ICP ao vivo no painel lateral e abra <b>Resultados</b> para o parecer, os gráficos e as ações sugeridas.</li></ol>
<h4>As quatro respostas</h4><ul><li><b>Conforme (1,0):</b> o projeto traz representação gráfica detalhada e especificação técnica completa, explícita e compatível com o parâmetro exigido.</li><li><b>Não conforme (0,0):</b> o projeto especifica o parâmetro em desacordo com a norma ou a recomendação.</li><li><b>Sem informação (−λ):</b> o item foi omitido nas pranchas, detalhes e memoriais (lacuna de projeto). Recebe nota negativa (λ = 0,5 por padrão, ajustável em Configurações), porque a omissão deixa a decisão para o canteiro e vale menos que uma especificação errada.</li><li><b>N/A (excluído):</b> o critério não se aplica à tipologia ou ao acabamento cadastrados e sai do cálculo.</li></ul><p>Nos itens com valor, digite o valor <b>especificado no projeto</b>; o app compara com o limite e decide.</p>
<h4>Origem e criticidade de cada item</h4><p><b>Origem:</b> Norma (exigência explícita da ABNT), Literatura (bibliografia e manuais técnicos) ou Boa prática (recomendação preventiva adicional). Use os filtros “Só norma / literatura / boas práticas”. <b>Criticidade (peso):</b> Crítico = 3 (segurança, estanqueidade ou patologia severa), Maior = 2, Menor = 1.</p>
<h4>Como o ICP é calculado</h4><p>ICP (%) = Σ(nota × peso) ÷ Σ(1,0 × peso dos itens aplicáveis) × 100, por bloco e global (o resultado não fica abaixo de 0%). Faixas: ≥ 90% Conforme / Excelente; 70% a 89% Parcialmente Conforme / Satisfatório; &lt; 70% Não Conforme / Insuficiente. <b>Regra eliminatória:</b> qualquer item Crítico não conforme ou sem informação impede a faixa máxima.</p>
<h4>Os blocos</h4><ul>${Object.keys(BLOCO).map(k=>'<li><b>'+k+' – '+CATS.find(c=>c.id==k).n+':</b> '+BLOCO[k]+'</li>').join('')}</ul>
<h4>Dicas</h4><ul><li>Atalhos no cartão focado: C, N, A, S e setas ↑↓.</li><li>Itens que não se aplicam ao cadastro da obra (por exemplo, itens cerâmicos em fachada de textura) aparecem como “N/A automático” e ficam fora do cálculo.</li><li>Em cada item, o ícone <b>i</b> abre uma explicação orientativa sobre o que verificar.</li><li>Na aba F há o botão “Não se aplica”, que marca a aba toda como N/A.</li><li>Clique numa camada do corte para filtrar os itens relacionados.</li><li>Os parâmetros de traço (≥ 4 partes de areia por 1 de cimento; ≤ 350 kg/m³) são referências adotadas no estudo e podem ser editados em PARAMETROS_NORMATIVOS.</li></ul><div class="row"><button class="btn pri" data-act="close">Entendi</button></div>`;
